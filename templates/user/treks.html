{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Browse Treks</h2>
<div class="search-card p-3 mb-4 rounded-4">
    <form class="row g-2" method="get">
        <div class="col-md-4"><input class="form-control" name="search" value="{{ search }}" placeholder="Trek name"></div>
        <div class="col-md-4"><input class="form-control" name="location" value="{{ location }}" placeholder="Location"></div>
        <div class="col-md-2"><input class="form-control" name="difficulty" value="{{ difficulty }}" placeholder="Difficulty"></div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Filter</button></div>
    </form>
</div>
<ul class="list-group shadow-sm rounded-4 overflow-hidden">
    {% for trek in treks %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ trek.trek_name }}</strong><br>
            {{ trek.location }} | {{ trek.difficulty }} | Slots: {{ trek.available_slots }}
        </div>
        <div>
            <a class="btn btn-outline-primary btn-sm" href="{{ url_for('user.trek_details', trek_id=trek.trek_id) }}">View</a>
            <form method="post" action="{{ url_for('user.book_trek', trek_id=trek.trek_id) }}" class="d-inline">
                <button class="btn btn-success btn-sm" type="submit">Book</button>
            </form>
        </div>
    </li>
    {% endfor %}
</ul>
{% endblock %}
