{% extends 'base.html' %}
{% block content %}
<div class="card p-4">
    <h2>{{ trek.trek_name }}</h2>
    <p><strong>Location:</strong> {{ trek.location }}</p>
    <p><strong>Difficulty:</strong> {{ trek.difficulty }}</p>
    <p><strong>Duration:</strong> {{ trek.duration }}</p>
    <p><strong>Available Slots:</strong> {{ trek.available_slots }}</p>
    <p><strong>Description:</strong> {{ trek.description }}</p>
    <form method="post" action="{{ url_for('user.book_trek', trek_id=trek.trek_id) }}">
        <button class="btn btn-success" type="submit">Book This Trek</button>
    </form>
</div>
{% endblock %}
