{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">User Dashboard</h2>
<div class="row g-3 mb-4">
    <div class="col-md-6"><div class="card p-3"><h5>Open Treks</h5><h3>{{ treks|length }}</h3></div></div>
    <div class="col-md-6"><div class="card p-3"><h5>My Recent Bookings</h5><h3>{{ upcoming_bookings|length }}</h3></div></div>
</div>
<ul class="list-group">
    {% for trek in treks %}
        <li class="list-group-item">{{ trek.trek_name }} - {{ trek.location }} - {{ trek.difficulty }}</li>
    {% endfor %}
</ul>
{% endblock %}
